<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iPhone Duo — 3D 参数模型</title>
<style>
  :root {
    --ink: #11151b;
    --muted: #5b6675;
    --line: rgba(17, 21, 27, 0.1);
    --glass: rgba(255, 255, 255, 0.66);
    --accent: #0a6bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 780px at 50% 8%, #fbfcfd 0%, #eef2f6 42%, #dde5ee 72%, #cbd6e2 100%);
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; }
  #viewport { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  .top {
    position: absolute; top: 28px; left: 32px; z-index: 3;
    pointer-events: none; max-width: min(420px, 42vw);
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); font-weight: 650;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1px; background: currentColor; opacity: .55;
  }
  h1 {
    margin: 10px 0 6px;
    font-size: clamp(28px, 3.4vw, 44px);
    line-height: 1.02; letter-spacing: -0.035em; font-weight: 700;
  }
  h1 span { color: #7c8796; font-weight: 400; }
  .sub { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .specs {
    margin-top: 16px; display: flex; flex-wrap: wrap; gap: 7px;
    pointer-events: auto;
  }
  .chip {
    font-size: 11.5px; color: #2c3540; background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.8); box-shadow: 0 2px 10px rgba(20,35,55,.05);
    padding: 5px 9px; border-radius: 999px; backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .chip b { font-weight: 650; }

  .hint {
    position: absolute; right: 30px; top: 30px; z-index: 3;
    font-size: 11px; color: #75808f; text-align: right; line-height: 1.6;
    pointer-events: none;
  }
  .hint kbd {
    font: inherit; padding: 1px 5px; border-radius: 4px;
    border: 1px solid rgba(20,30,45,.14); background: rgba(255,255,255,.5);
  }

  .dock {
    position: relative; z-index: 4;
    margin: 0 auto 22px; width: min(1060px, calc(100vw - 36px));
    background: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 18px 50px -22px rgba(20,40,70,.35), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(22px) saturate(1.3);
    border-radius: 22px; padding: 14px 18px 13px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .group-label {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: #7b8695; font-weight: 650; margin-right: 2px;
  }
  button.act {
    appearance: none; border: 1px solid rgba(18,28,42,.1);
    background: rgba(255,255,255,.72); color: #232b36;
    font: inherit; font-size: 12px; font-weight: 550;
    padding: 7px 11px; border-radius: 10px; cursor: pointer;
    transition: background .16s, border-color .16s, transform .16s, color .16s;
  }
  button.act:hover { background: #fff; border-color: rgba(18,28,42,.2); }
  button.act:active { transform: translateY(1px); }
  button.act.on { background: #12171f; color: #fff; border-color: #12171f; }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act.primary:hover { background: #0059e0; border-color: #0059e0; }

  .slider { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 220px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 22px; flex: 1;
    background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(90deg, #9aa5b3, #2b3440);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(15,25,40,.2);
    box-shadow: 0 2px 8px rgba(20,35,55,.28); margin-top: -7px;
  }
  .angle {
    font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600;
    min-width: 86px; color: #2a3340;
  }
  .angle small { color: #8b95a3; font-weight: 500; }

  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }

  .badge {
    font-size: 11px; color: #6d7887; padding-left: 2px;
  }
  .badge b { color: #1d2530; font-weight: 650; }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: radial-gradient(1000px 700px at 50% 20%, #fafcfd, #dfe7f0);
    transition: opacity .5s ease, visibility .5s;
  }
  #loading.done { opacity: 0; visibility: hidden; }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(30,45,65,.15); border-top-color: #1d2733;
    animation: spin 1s linear infinite;
  }
  .loader p { margin: 0; font-size: 12px; letter-spacing: .08em; color: #6a7686; text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(8px);
    background: rgba(18,23,31,.9); color: #fff; font-size: 12px;
    padding: 9px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    /* stack: copy / canvas / dock — the model never sits behind the text */
    #app { grid-template-rows: auto minmax(0, 1fr) auto; }
    .top { position: static; max-width: none; padding: 16px 18px 4px; }
    .hint { display: none; }
    .dock { margin-bottom: 12px; padding: 12px; border-radius: 18px; gap: 10px; }
    .sep { display: none; }
    .group-label { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="eyebrow">Apple · Concept model</div>
    <h1>iPhone Duo <span>/ fold</span></h1>
    <p class="sub">按官方 2026 年规格 1:1 建模的折叠 iPhone。两块面板、隐藏式铰链、双层屏幕与相机凸台全部由参数生成。</p>
    <div class="specs">
      <span class="chip">展开 <b>164.6 × 117.8 × 5.2 mm</b></span>
      <span class="chip">折叠 <b>82.4 × 117.8 × 11.3 mm</b></span>
      <span class="chip">内屏 <b>7.6″ 1878×2670</b></span>
      <span class="chip">外屏 <b>5.4″ 1398×2034</b></span>
      <span class="chip">重量 <b>254 g</b></span>
    </div>
  </div>
  <div class="hint">
    拖拽旋转 · 滚轮缩放<br />
    <kbd>1</kbd> 展开 <kbd>2</kbd> 折叠 <kbd>3</kbd> 背面 <kbd>D</kbd> 尺寸
  </div>

  <div id="viewport"></div>

  <div class="dock">
    <div class="group">
      <span class="group-label">Pose</span>
      <button class="act" data-pose="180">展开</button>
      <button class="act" data-pose="120">半开</button>
      <button class="act" data-pose="65">帐篷</button>
      <button class="act" data-pose="0">折叠</button>
    </div>
    <div class="sep"></div>
    <div class="slider">
      <span class="group-label">Fold</span>
      <input id="fold" type="range" min="0" max="180" step="0.5" value="180" aria-label="折叠角度" />
      <span class="angle" id="angle">180° <small>open</small></span>
    </div>
    <div class="sep"></div>
    <div class="group">
      <span class="group-label">View</span>
      <button class="act" id="front">正面</button>
      <button class="act" id="back">背面</button>
      <button class="act" id="hero">3/4</button>
    </div>
    <div class="group">
      <button class="act" id="finish">Star White</button>
      <button class="act" id="dims">尺寸</button>
      <button class="act" id="spin">自转</button>
      <button class="act primary" id="glb">导出 GLB</button>
    </div>
    <div class="badge" id="dimreadout">164.6 × 117.8 × 5.2 mm</div>
  </div>
</div>

<div id="loading"><div class="loader"><div class="spinner"></div><p>Building iPhone Duo</p></div></div>
<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
